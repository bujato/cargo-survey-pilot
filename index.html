<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Cargo Survey V6</title><style> *{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#10283e;font:16px system-ui}header{background:#10283e;color:white;padding:22px;position:sticky;top:0;z-index:2}main{max-width:800px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #10283e12}h1,h2,h3{margin:0 0 12px}label{display:block;font-weight:600;margin-top:12px}input,select,textarea,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #c5d0da}input,select,textarea{width:100%;background:white}button{background:#10283e;color:white;border:0;cursor:pointer;margin:5px 0}button.green{background:#087d56}button.light{background:#e4edf5;color:#10283e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#536779;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#edf4f8;padding:12px;border-radius:10px;text-align:center}.stats b{display:block;font-size:26px}progress{width:100%;accent-color:#087d56}img{max-width:100%;max-height:160px;border-radius:8px}pre{white-space:pre-wrap} [hidden]{display:none!important}#status{white-space:pre-wrap;font-size:13px}article{border-top:1px solid #dce4eb;padding:12px 0}</style></head><body><header><b>CARGO SURVEY · V6</b><div id="status">Starting…</div></header><main><section id="login"><h2>Pilot Edition</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><div id="app" hidden><section><div class="row"><button id="sync" class="green">Sync now</button><button id="logout" class="light">Sign out</button></div><label>Current vessel<select id="vessel"></select></label><form id="vesselForm"><label>New vessel<input id="vname" required placeholder="Vessel name"></label><label>Client<input id="client" value="Envision"></label><label>Port<input id="port" value="Pecém"></label><button>Add vessel</button></form></section><section id="operation" hidden><h2>Operation dashboard</h2><div class="stats" id="stats"></div><div id="progress"></div><form id="categoryForm"><div class="row"><label>Cargo type<input id="cname" required placeholder="Blade"></label><label>Total<input id="qty" type="number" min="1" required></label></div><button>Add category</button></form></section><section id="inspection" hidden><h2 id="formTitle">New inspection</h2><form id="inspectionForm"><label>Cargo<select id="category" required></select></label><label>Item number<input id="item" type="number" min="1" required></label><label>ID part<input id="part" required></label><label>Truck<input id="truck"></label><label>Inspection date<input id="date" type="text" placeholder="YYYY-MM-DD" required></label><label>Start lifting</label><div class="row"><input id="start" inputmode="numeric" maxlength="4" placeholder="1155" required><button type="button" class="light" data-now="start">NOW</button></div><label>Final lifting</label><div class="row"><input id="end" inputmode="numeric" maxlength="4" placeholder="1202" required><button type="button" class="light" data-now="end">NOW</button></div><label>Damage<select id="damage"><option>No</option><option>Yes</option></select></label><label id="damageBox" hidden>Description<textarea id="description"></textarea></label><label>Photos<input id="photos" type="file" accept="image/*" multiple></label><label>Camera<input id="camera" type="file" accept="image/*" capture="environment"></label><div id="photoPreview"></div><button class="green">Save inspection</button> <button type="button" id="cancel" class="light">Clear</button></form></section><section id="history" hidden><h2>Inspection history</h2><input id="search" placeholder="Search ID, truck or category"><div class="row"><button id="csv">Export Excel CSV</button><button id="zip">Export ZIP</button></div><div id="records"></div></section></div></main><script src="app.js"></script></body></html>
